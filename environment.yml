name: HACplus_env
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - ninja
  - pyg
  - cuda-version=12.4
  - cuda-toolkit=12.4
  - python=3.11
  - plyfile=0.8.1
  - pytorch=2.4.1
  - torchvision=0.19.1
  - tqdm
  - pytorch-scatter
  - pip:
    - einops
    - wandb
    - lpips
    - colorama
    - opencv-python
  # The CUDA-extension submodules (diff-gaussian-rasterization, gridencoder,
  # arithmetic) are installed separately by scripts/env_builder.sh with
  # --no-build-isolation, since their setup.py imports torch at build time
  # and pip's isolated build env can't see it otherwise.
  # simple-knn is unused by this codebase and intentionally left out.
